<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remix Informatika LearnStudio</title>
    <script>
      (function () {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _currentFetch;
            },
            set: function (newFn) {
              _currentFetch = newFn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (err) {
          // Ignore if environment does not allow redefining
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
